<div class="container">
    <form [formGroup]="comprarComicForm">
        <h1 translate [translateParams]="{nombreSemillero : tituloComplemento.nombreSemillero}" class="mt-2 mb-2">
            gestionarComic.titulo</h1>
        <h3 class="mt-2 mb-2">{{'comprarComic.titulo' | translate}} (ID: {{f.id.value}})</h3>
        <hr>
        <div class="row mt-2">
            <div class="col-6">
                <label for="txtNombre">{{'gestionarComic.nombre' | translate}}:</label>
                <input id="txtNombre" type="text" class="form-control" maxlength="50" formControlName="nombre" readonly>
            </div>
            <div class="col-6">
                <label for="txtCantidad">{{'gestionarComic.cantidad' | translate}}:</label>
                <input id="txtCantidad" type="number" class="form-control" maxlength="50" formControlName="cantidad"
                    [ngClass]="{'is-invalid':validoFormulario && f.cantidad.errors}">
                <div *ngIf="validoFormulario && f.cantidad.errors">
                    <span class="text-danger" *ngIf="f.cantidad.errors.required">{{'gestionarComic.camporequerido' |
                        translate}}</span>
                    <span class="text-danger" *ngIf="f.cantidad.errors.min"> {{'comprarComic.minval' |
                        translate}}</span>
                    <span class="text-danger" *ngIf="f.cantidad.errors.max"> {{'comprarComic.maxval' |
                        translate}}</span>
                    <span class="text-danger" *ngIf="f.cantidad.errors.pattern"> {{'comprarComic.numval' |
                        translate}}</span>

                </div>
            </div>
        </div>
        <div class="row mt-4 mb-4">
            <div class="col-7"></div>
            <div class="col-3 text-right ">
                <button type="button" class="btn btn-success" (click)="comprar()"><i class='fas fa-dollar-sign'></i>
                    {{'comprarComic.btn.guardar' |
                    translate}}</button>
            </div>
            <div class="col-2 text-right ">
                <button type="button" class="btn btn-primary" (click)="regresar()"><i
                        class='fas fa-arrow-alt-circle-left'></i> {{'comprarComic.btn.cancelar' |
                    translate}}</button>
            </div>
        </div>
        <input type="hidden" formControlName="id" />
    </form>
    <div *ngIf="mostrarItem" class="alert alert-danger mt-4 mb-4" role="alert">
        {{mensajeError}}
    </div>
</div>
